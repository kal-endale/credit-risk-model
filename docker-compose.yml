services:
  credit-risk-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: credit-risk-api:latest
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/best_model.joblib
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s